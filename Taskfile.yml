version: '3'

tasks:
  default:
    deps: [build]

  build:
    desc: "Build the tool for the host"
    cmds:
      - cargo build --locked {{.CLI_ARGS}}

  check:
    desc: "Format and cross-check targets without platform SDKs"
    cmds:
      - cargo fmt --all --check
      - task: check-target
        vars: { TARGET: x86_64-unknown-linux-musl }
      - task: check-target
        vars: { TARGET: aarch64-unknown-linux-musl }
      - task: check-target
        vars: { TARGET: aarch64-apple-darwin }
      - task: check-target
        vars: { TARGET: x86_64-pc-windows-msvc }

  check-target:
    internal: true
    cmds:
      - cargo check --all-targets --locked --target {{.TARGET}} {{.CLI_ARGS}}

  test:
    desc: "Run every test on the host"
    cmds:
      - cargo nextest run --locked {{.CLI_ARGS}}
