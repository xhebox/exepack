[package]
name = "exepack"
version = "0.6.0"
edition = "2024"
description = "Embed items into an executable's own container, one per item, with optional compression."
license = "MIT"
repository = "https://github.com/xhebox/exepack"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow = "1"
brotli = "9"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
ruzstd = "0.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
arwen-codesign = "0.0.1-alpha.1"
object = { version = "0.40", default-features = false, features = ["read_core", "macho", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
editpe = "0.2.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints.rust]
# A `pub` item must be reachable from the crate root.
unreachable_pub = "deny"
