name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

env:
  # Task's builtin tar on Windows has no -z; use the runner's.
  TASK_CORE_UTILS: 'false'

jobs:
  dist:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runs-on: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runs-on: macos-26
            target: aarch64-apple-darwin
          - runs-on: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-${{ runner.os }}-${{ runner.arch }}

      - name: Build
        run: task build TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: exepack-${{ matrix.target }}
          path: dist/exepack-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # After the GitHub release, so cargo binstall finds the tarballs once crates.io lists the version.
  crates-io:
    needs: release
    runs-on: ubuntu-26.04
    # Trusted publishing on crates.io names this environment, which only v* tags may deploy to.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache: false

      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
