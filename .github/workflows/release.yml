name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

env:
  # Where task dist keeps release tarballs; OCI wants it lowercase, as this repository's name is.
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up task and oras
        uses: ./.github/actions/setup-task-oras

      # Fetch what the pull request built and pushed; never build here.
      - name: Dist
        run: task dists BUILD=0 PUSH=0

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
