name: Test

on:
  pull_request:

permissions:
  contents: read

env:
  # Where task dist keeps release tarballs; OCI wants it lowercase, as this repository's name is.
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  # Task's builtin tar on Windows has no -z; use the runner's.
  TASK_CORE_UTILS: 'false'

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}

      # rust-toolchain.toml brings every target the check crosses to.
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-check

      - name: Check
        run: task check

  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runs-on: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runs-on: macos-26
            target: aarch64-apple-darwin
          - runs-on: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Set up task and oras
        uses: ./.github/actions/setup-task-oras

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-${{ runner.os }}-${{ runner.arch }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: task test -- --target ${{ matrix.target }}

      # Build and publish the release tarball here, so the release fetches it rather than building after the merge.
      # A fork's token cannot push; the release builds what it does not find.
      - name: Dist
        run: task dist TARGET=${{ matrix.target }} PUSH=${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
